name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Build with Gradle
      run: gradle assembleDebug assembleRelease --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Verify APK integrity
      if: always()
      run: |
        echo "=== Debug APK ==="
        ls -la app/build/outputs/apk/debug/ || echo "No debug APK found"
        echo ""
        echo "=== Native libs in APK ==="
        unzip -l app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | grep "lib/" || echo "No native libs found"
        echo ""
        echo "=== APK file count ==="
        unzip -l app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | tail -1
